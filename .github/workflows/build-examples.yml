name: Build Examples

env:
  PROJECT_GENERATOR_VERSION: v0.95.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    paths:
      - ".github/workflows/build-examples.yml"
      - "addon_config.mk"
      - "example_*/**"
      - "libs/**"
      - "scripts/**"
      - "src/**"
  pull_request:
    paths:
      - ".github/workflows/build-examples.yml"
      - "addon_config.mk"
      - "example_*/**"
      - "libs/**"
      - "scripts/**"
      - "src/**"
  workflow_dispatch:

jobs:
  build-examples-macos:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout openFrameworks
        uses: actions/checkout@v4
        with:
          repository: openframeworks/openFrameworks
          ref: '0.12.1'
          path: openFrameworks
          submodules: recursive

      - name: Download OF libs
        run: openFrameworks/scripts/osx/download_libs.sh

      - name: Checkout ofxLaser
        uses: actions/checkout@v4
        with:
          path: openFrameworks/addons/ofxLaser
          submodules: recursive

      - name: Build examples
        working-directory: openFrameworks/addons/ofxLaser
        run: ./scripts/build-examples.sh

      - name: Install projectGenerator
        working-directory: openFrameworks/addons/ofxLaser
        run: |
          PG_DIR="${RUNNER_TEMP}/projectGenerator"
          rm -rf "${PG_DIR}"
          mkdir -p "${PG_DIR}"
          PG_ASSET="projectGenerator-osx.zip"
          if [[ "$(uname -m)" == "arm64" ]]; then
            PG_ASSET="projectGenerator-mac-arm64.zip"
          fi
          curl -L -o "${PG_DIR}/${PG_ASSET}" \
            "https://github.com/openframeworks/projectGenerator/releases/download/${PROJECT_GENERATOR_VERSION}/${PG_ASSET}"
          unzip -q "${PG_DIR}/${PG_ASSET}" -d "${PG_DIR}"
          PG_BIN="$(find "${PG_DIR}" -path "*/Contents/Resources/app/app/projectGenerator" -type f -print -quit)"
          test -n "${PG_BIN}"
          chmod +x "${PG_BIN}"
          echo "PROJECT_GENERATOR=${PG_BIN}" >> "${GITHUB_ENV}"

      - name: ProjectGenerator smoke test
        working-directory: openFrameworks/addons/ofxLaser
        env:
          PG_PLATFORM: osx
          PG_BUILD_TARGET: Release
        run: ./scripts/projectgenerator-smoke.sh

  build-examples-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OF_LINUX_APT_PACKAGES: >-
        build-essential
        pkg-config
        libssl-dev
        libcurl4-openssl-dev
        libjack-jackd2-dev
        freeglut3-dev
        libasound2-dev
        libx11-dev
        libxmu-dev
        libxrandr-dev
        libxxf86vm-dev
        libgl1-mesa-dev
        libglu1-mesa-dev
        libraw1394-dev
        libudev-dev
        libdrm-dev
        libglew-dev
        libxcursor-dev
        libxi-dev
        libxinerama-dev
        libopenal-dev
        libsndfile1-dev
        libfreeimage-dev
        libcairo2-dev
        libfreetype6-dev
        libfontconfig-dev
        libharfbuzz-dev
        libpulse-dev
        libusb-1.0-0-dev
        libgtk2.0-dev
        libgtk-3-dev
        libassimp-dev
        librtaudio-dev
        libgstreamer1.0-dev
        libgstreamer-plugins-base1.0-dev
        libglfw3-dev
        liburiparser-dev
        libpugixml-dev
        libxml2-dev
        libpoco-dev
        zlib1g-dev

    steps:
      - name: Checkout openFrameworks
        uses: actions/checkout@v4
        with:
          repository: openframeworks/openFrameworks
          ref: '0.12.1'
          path: openFrameworks
          submodules: recursive

      - name: Install Linux build dependencies
        run: |
          # The openFrameworks installer upgrades parts of the hosted runner and
          # has shown 50+ minute stalls in CI. Install only the packages needed
          # for the pinned OF 0.12.1 Linux build instead.
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ${OF_LINUX_APT_PACKAGES}

      - name: Download OF Linux libs
        run: openFrameworks/scripts/linux/download_libs.sh

      - name: Checkout ofxLaser
        uses: actions/checkout@v4
        with:
          path: openFrameworks/addons/ofxLaser
          submodules: recursive

      - name: Build examples
        working-directory: openFrameworks/addons/ofxLaser
        env:
          BUILD_CORE_TARGET: Release
          EXAMPLE_TARGET: ReleaseNoOF
          JOBS: 4
        run: ./scripts/build-examples.sh

      - name: Install projectGenerator
        working-directory: openFrameworks/addons/ofxLaser
        run: |
          PG_DIR="${RUNNER_TEMP}/projectGenerator"
          rm -rf "${PG_DIR}"
          mkdir -p "${PG_DIR}"
          curl -L -o "${PG_DIR}/projectGenerator-linux.tar.bz2" \
            "https://github.com/openframeworks/projectGenerator/releases/download/${PROJECT_GENERATOR_VERSION}/projectGenerator-linux.tar.bz2"
          tar -xjf "${PG_DIR}/projectGenerator-linux.tar.bz2" -C "${PG_DIR}"
          chmod +x "${PG_DIR}/projectGenerator"
          echo "PROJECT_GENERATOR=${PG_DIR}/projectGenerator" >> "${GITHUB_ENV}"

      - name: ProjectGenerator smoke test
        working-directory: openFrameworks/addons/ofxLaser
        env:
          PG_PLATFORM: linux64
          PG_BUILD_TARGET: ReleaseNoOF
          JOBS: 4
        run: ./scripts/projectgenerator-smoke.sh

  build-examples-windows-msys2:
    runs-on: windows-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout openFrameworks
        uses: actions/checkout@v4
        with:
          repository: openframeworks/openFrameworks
          ref: '0.12.1'
          path: openFrameworks
          submodules: recursive

      - name: Checkout ofxLaser
        uses: actions/checkout@v4
        with:
          path: openFrameworks/addons/ofxLaser
          submodules: recursive

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2.27.0
        with:
          cache: true
          release: true
          update: true
          msystem: ucrt64
          pacboy: >-
            openssl:p
            python:p
            gcc:p
            assimp:p
            cairo:p
            curl:p
            freeglut:p
            freeimage:p
            glew:p
            glfw:p
            glm:p
            fmt:p
            zlib:p
            brotli:p
            libpng:p
            harfbuzz:p
            libsndfile:p
            libusb:p
            libxml2:p
            mpg123:p
            nlohmann-json:p
            openal:p
            opencv:p
            pkgconf:p
            pugixml:p
            rtaudio:p
            uriparser:p
            utf8cpp:p
          install: >-
            unzip
            make

      - name: Download OF MSYS2 libs
        working-directory: openFrameworks
        run: ./scripts/msys2/download_libs.sh --silent -a ucrt64

      - name: Build examples
        working-directory: openFrameworks/addons/ofxLaser
        env:
          BUILD_CORE_TARGET: Debug
          EXAMPLE_TARGET: DebugNoOF
          JOBS: 4
        run: ./scripts/build-examples.sh

      - name: Build projectGenerator
        working-directory: openFrameworks/addons/ofxLaser
        run: |
          PG_CMD_DIR="../../apps/projectGenerator/commandLine"
          make -C "${PG_CMD_DIR}" DebugNoOF PROJECT_CFLAGS="-include algorithm" -j"${JOBS:-4}"

          for PG_BIN in \
            "${PG_CMD_DIR}/bin/projectGenerator_debug.exe" \
            "${PG_CMD_DIR}/bin/projectGenerator.exe" \
            "${PG_CMD_DIR}/bin/commandLine_debug.exe" \
            "${PG_CMD_DIR}/bin/commandLine.exe"
          do
            if [[ -f "${PG_BIN}" ]]; then
              echo "PROJECT_GENERATOR=${PG_BIN}" >> "${GITHUB_ENV}"
              exit 0
            fi
          done

          echo "Could not find built projectGenerator binary" >&2
          find "${PG_CMD_DIR}/bin" -maxdepth 2 -type f -print >&2
          exit 1

      - name: ProjectGenerator smoke test
        working-directory: openFrameworks/addons/ofxLaser
        env:
          PG_PLATFORM: msys2
          PG_BUILD_TARGET: DebugNoOF
          JOBS: 4
        run: ./scripts/projectgenerator-smoke.sh
